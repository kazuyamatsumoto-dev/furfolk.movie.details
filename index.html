<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>furfolk 処理済み動画ギャラリー</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --border:#2a2f3a;
    --text:#e8eaf0; --muted:#9aa3b2; --accent:#7aa2ff; --accent-2:#5cc8a5;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f0f2f5; --border:#e2e5ea;
      --text:#1b1e24; --muted:#5c6470; --accent:#3b63e0; --accent-2:#1f9b74; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Hiragino Sans,Meiryo,sans-serif;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:var(--panel); border-bottom:1px solid var(--border);
    padding:14px 20px;
  }
  h1{ font-size:17px; margin:0 0 10px; font-weight:600; }
  .controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input[type="search"]{
    flex:1; min-width:180px; padding:8px 12px; border-radius:8px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-size:14px;
  }
  select{
    padding:8px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:14px;
  }
  .count{ font-size:12px; color:var(--muted); margin-left:auto; white-space:nowrap; }
  main{ padding:16px 20px 40px; max-width:1400px; margin:0 auto; }
  .grid{
    display:grid; gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    overflow:hidden; display:flex; flex-direction:column; text-decoration:none; color:inherit;
    transition:transform .12s ease, border-color .12s ease;
  }
  .card:hover{ transform:translateY(-2px); border-color:var(--accent); }
  .thumb{ width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--panel-2); display:block; }
  .meta{ padding:8px 10px 10px; font-size:12px; }
  .title{
    font-size:13px; font-weight:600; margin:0 0 4px; color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .tag{
    display:inline-block; font-size:10px; padding:2px 7px; border-radius:999px;
    background:var(--panel-2); color:var(--accent); border:1px solid var(--border); margin-bottom:4px;
  }
  .sub{ color:var(--muted); font-size:11px; line-height:1.5; }
  .empty{ text-align:center; color:var(--muted); padding:60px 0; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>furfolk 処理済み動画ギャラリー</h1>
  <div class="controls">
    <input type="search" id="q" placeholder="タイトルで検索…">
    <select id="cat"><option value="">すべてのカテゴリ</option></select>
    <select id="sort">
      <option value="date-desc">処理日: 新しい順</option>
      <option value="date-asc">処理日: 古い順</option>
      <option value="title-asc">タイトル順</option>
    </select>
    <span class="count" id="count"></span>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">該当する項目がありません</div>
</main>
<script>
async function main(){
  const res = await fetch('data.json');
  const data = await res.json();

  const catSel = document.getElementById('cat');
  const cats = [...new Set(data.map(d => d.category))].sort();
  for(const c of cats){
    const o = document.createElement('option');
    o.value = c; o.textContent = c + ' (' + data.filter(d=>d.category===c).length + ')';
    catSel.appendChild(o);
  }

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const qEl = document.getElementById('q');
  const sortEl = document.getElementById('sort');

  function render(){
    const q = qEl.value.trim().toLowerCase();
    const cat = catSel.value;
    let items = data.filter(d => {
      if(cat && d.category !== cat) return false;
      if(q && !d.title.toLowerCase().includes(q)) return false;
      return true;
    });
    const sort = sortEl.value;
    items.sort((a,b) => {
      if(sort === 'title-asc') return a.title.localeCompare(b.title);
      if(sort === 'date-asc') return (a.processedDate||'').localeCompare(b.processedDate||'');
      return (b.processedDate||'').localeCompare(a.processedDate||'');
    });

    countEl.textContent = items.length + ' / ' + data.length + ' 件';
    grid.innerHTML = '';
    empty.style.display = items.length ? 'none' : 'block';

    const frag = document.createDocumentFragment();
    for(const d of items){
      const a = document.createElement('a');
      a.className = 'card';
      a.href = d.driveUrl || '#';
      a.target = '_blank';
      a.rel = 'noopener';

      const img = document.createElement('img');
      img.className = 'thumb';
      img.loading = 'lazy';
      img.src = d.img || '';
      img.alt = d.title;
      a.appendChild(img);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML =
        '<span class="tag">' + d.category + '</span>' +
        '<p class="title" title="' + d.title.replace(/"/g,'&quot;') + '">' + d.title + '</p>' +
        '<div class="sub">' +
          (d.folderPath && d.folderPath.length ? d.folderPath.join(' / ') + '<br>' : '') +
          d.processedDate + ' ・ ' + (d.fileSizeMB ?? '?') + 'MB' +
        '</div>';
      a.appendChild(meta);
      frag.appendChild(a);
    }
    grid.appendChild(frag);
  }

  qEl.addEventListener('input', render);
  catSel.addEventListener('change', render);
  sortEl.addEventListener('change', render);
  render();
}
main();
</script>
</body>
</html>
